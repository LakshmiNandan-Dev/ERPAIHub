[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    auth: Authentication & authorisation tests
    chat: Chat streaming tests
    rag: RAG document ingestion and retrieval tests
    sessions: Chat session management tests
    performance: Performance Agent diagnostic tests
    memory: History compression & memory tests
    security: Security and access control tests
    rlaif: RLAIF quality audit tests
    llm: LLM provider configuration tests
    deployment: Deployment Agent ReAct loop tests
    cloning: Cloning Agent tests
    patching: Patching Agent tests (batch + interactive adop)

# Show slowest 10 tests and full traceback on failure
addopts = --tb=short --durations=10
