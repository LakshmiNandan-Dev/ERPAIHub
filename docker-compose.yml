version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    restart: always
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipassword
      POSTGRES_DB: erpai_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d erpai_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama LLM ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    environment:
      # Keep the model resident so requests skip a cold reload and can reuse the
      # previous prompt's KV cache (default is only 5m). "-1" = keep forever.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Serve multiple requests concurrently and keep more than one model warm.
      # NUM_PARALLEL slots share the context window; raise only with enough RAM/VRAM.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      # Requests beyond the parallel slots queue up to this depth, then get 503
      # (surfaced to the agent as a transient error and retried with backoff).
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-128}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: erpai-redis
    restart: always
    ports:
      - "6379:6379"

  # ── FastAPI ───────────────────────────────────────────────
  api:
    build: ./api
    container_name: ai-api
    restart: always
    environment:
      DATABASE_URL: postgresql://aiuser:aipassword@postgres:5432/erpai_hub
      OLLAMA_URL: http://ollama:11434
      # Default local model used when no per-request/credential model is set.
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.1:8b}
      # Used to encrypt admin-managed secrets (SSH/DB passwords, LLM API keys) at rest.
      # Override with a strong random value in production.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-change-me}
      # Where the SSO callback redirects the browser back to after login
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # First-run admin bootstrap (only created when no such user exists).
      # Set a strong password in production; change it after first login.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@oraebs.com}
      # Recovery switch: set to 1 to reset the bootstrap admin password on startup.
      BOOTSTRAP_ADMIN_RESET: ${BOOTSTRAP_ADMIN_RESET:-0}
      # Optional fixed CORS allow-list (comma-separated). Default: any host on :5173.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Redis for live telemetry (connected users, counters, open-stream gauge)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Reinforce the Ollama keep-alive on each request (see ollama service).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Exact-match cache (Redis) for deterministic background completions.
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-1}
      LLM_CACHE_TTL: ${LLM_CACHE_TTL:-86400}
      # Semantic cache (ChromaDB) for repeated standalone questions.
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-1}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.95}
      SEMANTIC_CACHE_TTL: ${SEMANTIC_CACHE_TTL:-21600}
      # Query-embedding + RAG-retrieval cache (Redis; version-stamped on index/delete).
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-1}
      RAG_CACHE_TTL: ${RAG_CACHE_TTL:-3600}
      EMBED_CACHE_TTL: ${EMBED_CACHE_TTL:-86400}
      # Advanced RAG: cross-encoder reranking + DuckDuckGo web fallback.
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-1}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-20}
      RAG_RERANK_MIN_SCORE: ${RAG_RERANK_MIN_SCORE:-0.0}
      RAG_WEB_FALLBACK_ENABLED: ${RAG_WEB_FALLBACK_ENABLED:-1}
      # Deployment-agent cost controls: estimated-token budget per chat request,
      # history window sent to the LLM, and retry cap for transient LLM failures.
      AGENT_TOKEN_BUDGET: ${AGENT_TOKEN_BUDGET:-8000}
      AGENT_HISTORY_MAX_MSGS: ${AGENT_HISTORY_MAX_MSGS:-12}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-2}
      # Per-agent LLM routing: complexity classifier picks small vs large model.
      # Per-agent provider/model overrides are managed in Admin Console → Agent Routing.
      LLM_ROUTING_ENABLED: ${LLM_ROUTING_ENABLED:-1}
      LLM_ROUTING_LARGE_THRESHOLD: ${LLM_ROUTING_LARGE_THRESHOLD:-2}
      # Provider tier defaults (override to match locally available models).
      LLM_TIER_OPENAI_SMALL: ${LLM_TIER_OPENAI_SMALL:-gpt-4o-mini}
      LLM_TIER_OPENAI_LARGE: ${LLM_TIER_OPENAI_LARGE:-gpt-4o}
      LLM_TIER_ANTHROPIC_SMALL: ${LLM_TIER_ANTHROPIC_SMALL:-claude-haiku-4-5-20251001}
      LLM_TIER_ANTHROPIC_LARGE: ${LLM_TIER_ANTHROPIC_LARGE:-claude-sonnet-4-6}
      LLM_TIER_GEMINI_SMALL: ${LLM_TIER_GEMINI_SMALL:-gemini-2.0-flash}
      LLM_TIER_GEMINI_LARGE: ${LLM_TIER_GEMINI_LARGE:-gemini-2.5-pro}
      # Ollama tiers default to OLLAMA_DEFAULT_MODEL (routing no-op) until a
      # heavier local model is set here.
      LLM_TIER_OLLAMA_SMALL: ${LLM_TIER_OLLAMA_SMALL:-}
      LLM_TIER_OLLAMA_LARGE: ${LLM_TIER_OLLAMA_LARGE:-}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started

  # ── React Frontend ────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: ai-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  ollama_data:
  chroma_data:
